name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    publish:
        name: Publish to Cloudflare
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Checkout dpuse-engine
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: dpuse/dpuse-engine
                  token: ${{ secrets.ENGINE_PUBLISH }}
                  path: dpuse-engine

            - name: Patch Cargo.toml paths for CI
              run: sed -i 's|../../../../dpuse-engine|../../dpuse-engine|g' rust/dpuse-connector-file-store-emulator-core/Cargo.toml

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '>=23.11'
                  cache: npm

            - name: Install Rust
              run: rustup update stable && rustup default stable

            - name: Install wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish
              run: npm run publish
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
